<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading Tracker</title>
  <meta name="description" content="Track the books you have read and the books you want to read.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#view" data-text="nav.skip"></a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="#/log" data-text="appName"></a>
      <nav class="site-nav" data-label="nav.label">
        <ul>
          <li><a href="#/log" data-nav="log" data-text="nav.log"></a></li>
          <li><a href="#/books" data-nav="books" data-text="nav.books"></a></li>
          <li><a href="#/authors" data-nav="authors" data-text="nav.authors"></a></li>
          <li><a href="#/wishlist" data-nav="wishlist" data-text="nav.wishlist"></a></li>
        </ul>
      </nav>
      <button type="button" class="btn btn--quiet" id="reset-data" data-text="actions.resetData"></button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1">
    <p class="loading" data-text="titles.loading"></p>
  </main>

  <dialog id="form-dialog" class="dialog dialog--form" aria-labelledby="form-dialog-title">
    <div class="dialog__head">
      <h2 id="form-dialog-title" class="dialog__title"></h2>
      <button type="button" class="btn btn--icon" data-close data-label="actions.close">×</button>
    </div>
    <div class="dialog__body" id="form-dialog-body"></div>
  </dialog>

  <dialog id="confirm-dialog" class="dialog dialog--confirm" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message">
    <h2 id="confirm-dialog-title" class="dialog__title"></h2>
    <p id="confirm-dialog-message" class="dialog__message"></p>
    <div class="dialog__actions">
      <button type="button" class="btn" data-answer="no"></button>
      <button type="button" class="btn btn--primary" data-answer="yes"></button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
